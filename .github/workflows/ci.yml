# CI for @panelwave/types, @panelwave/cli and @panelwave/mcp: build all packages,
# check the bundled schema against the canonical panelwave/schema repo, run the
# tests, smoke-test both binaries.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/sync-schema.js --check compares against the canonical schema.
      - uses: actions/checkout@v4
        with:
          repository: panelwave/schema
          path: .schema

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (includes schema drift check)
        run: npm run build
        env:
          PANELWAVE_SCHEMA_DIR: ${{ github.workspace }}/.schema

      - name: Tests
        run: npm test

      - name: CLI smoke test
        run: node packages/cli/dist/index.js --help

      - name: MCP bridge smoke test
        run: |
          node packages/mcp/dist/index.js --version
          # without a token the bridge must refuse to start
          if PANELWAVE_TOKEN= node packages/mcp/dist/index.js < /dev/null; then echo "bridge started without a token" && exit 1; fi

      - name: Pack dry-run
        run: |
          npm pack --dry-run --workspace=packages/types
          npm pack --dry-run --workspace=packages/cli
          npm pack --dry-run --workspace=packages/mcp
